<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Szigetvilág</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#173e38"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Szigetvilág"><link rel="apple-touch-icon" href="./icon-180.png"><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font:14px system-ui;background:#8dc7e0}canvas{display:block;touch-action:none}#top{position:absolute;top:env(safe-area-inset-top);left:5px;right:5px;display:flex;gap:5px;overflow-x:auto;padding:5px;background:#173e38b9;border-radius:9px;color:white;white-space:nowrap}button{border:0;border-radius:9px;padding:10px;background:#f6ebcc;color:#25392b;font-weight:700;white-space:nowrap}button.on{background:#f8bf5d}#bottom{position:absolute;bottom:env(safe-area-inset-bottom);left:5px;right:5px;background:#173e38e8;color:white;padding:8px;border-radius:12px;max-height:34vh;overflow:auto}#items{display:flex;gap:5px;overflow-x:auto;padding:6px 0}#info{font-size:12px;line-height:1.5}#jobs{display:none;position:absolute;left:7px;right:7px;top:90px;padding:12px;background:#fff5d9;border-radius:12px;z-index:3}#jobs button{margin:3px}#msg{position:absolute;top:54px;left:7px;right:7px;text-align:center;color:white;text-shadow:0 1px 3px #000;font-size:13px;pointer-events:none}</style></head><body><div id="top"><button id="buildtab">🏗️ Építés</button><button id="select">👆 Lakos</button><button id="demolish">🔨 Bontás</button><button id="plant">🌲 Ültetés</button><button id="newperson">👶 Lakos +</button><button id="save">💾 Mentés</button><button id="reset">↺ Újrakezdés</button></div><div id="msg">Egy ujjal forgatás • két ujjal nagyítás • koppintás: művelet</div><div id="jobs"><b>Válassz foglalkozást:</b><div id="jobbuttons"></div><button id="closejobs">Bezár</button></div><div id="bottom"><div id="info"></div><div id="items"></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const S=new T.Scene();S.background=new T.Color(0x8bc8e5);S.fog=new T.Fog(0x8bc8e5,100,220);const C=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,350),R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.7));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0xd9f3ff,0x6b8150,2));const sun=new T.DirectionalLight(0xffe5a4,2.3);sun.position.set(-35,55,20);S.add(sun);const M=c=>new T.MeshStandardMaterial({color:c,roughness:.9});const mats={grass:M(0x79a75c),sand:M(0xd6c994),water:new T.MeshStandardMaterial({color:0x328ab5,roughness:.3,transparent:true,opacity:.88}),wood:M(0x785234),stone:M(0xc7bca3),roof:M(0x9b513a),green:M(0x367b3f),ore:M(0x6b7380),gold:M(0xc8a752),soil:M(0x755235),red:M(0x9d4638),white:M(0xe4dac3)};function obj(g,m,x=0,y=0,z=0,p=S){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function box(p,w,h,d,m,x=0,y=0,z=0){return obj(new T.BoxGeometry(w,h,d),m,x,y,z,p)}function cone(p,r,h,m,x=0,y=0,z=0,n=6){return obj(new T.ConeGeometry(r,h,n),m,x,y,z,p)}const SIZE=164,N=160;function rad(a){return 58+10*Math.sin(3*a+.4)+7*Math.sin(7*a-1.3)+5*Math.sin(11*a+.8)+3*Math.sin(17*a)}function inside(x,z){return Math.hypot(x,z)<rad(Math.atan2(z,x))-2}function H(x,z){let d=Math.hypot(x,z),edge=rad(Math.atan2(z,x));let h=Math.max(0,1-Math.hypot(x-23,z+16)/29)*13+Math.max(0,1-Math.hypot(x+30,z-23)/24)*9+Math.max(0,1-Math.hypot(x-2,z-36)/19)*5;h+=.8*Math.sin(x*.32)*Math.cos(z*.27);return Math.min(1,Math.max(-.8,(edge-d)/3))*1.5+h}const verts=[],idx=[],colors=[],c1=new T.Color(0x78a65b),c2=new T.Color(0xd8c996),c3=new T.Color(0x7e8972);for(let z=0;z<=N;z++)for(let x=0;x<=N;x++){let xx=(x/N-.5)*SIZE,zz=(z/N-.5)*SIZE,y=H(xx,zz);verts.push(xx,y,zz);let col=y<.6?c2:y>8?c3:c1;colors.push(col.r,col.g,col.b)}for(let z=0;z<N;z++)for(let x=0;x<N;x++){let i=z*(N+1)+x;idx.push(i,i+N+1,i+1,i+1,i+N+1,i+N+2)}let g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(verts,3));g.setAttribute('color',new T.Float32BufferAttribute(colors,3));g.setIndex(idx);g.computeVertexNormals();const ground=obj(g,new T.MeshStandardMaterial({vertexColors:true,roughness:1}));const sea=obj(new T.PlaneGeometry(350,350),mats.water,0,-.3,0);sea.rotation.x=-Math.PI/2;
const catalog=[['house','🏠 Ház',12,0,0],['villa','🏡 Villa',24,4,0],['farm','🌾 Farm',8,0,0],['mine','⛏️ Bánya',12,8,0],['refinery','🏭 Finomító',22,12,8],['mill','🌬️ Malom',18,0,0],['theatre','🎭 Színház',30,10,8],['university','🎓 Egyetem',45,15,15],['kindergarten','🧸 Óvoda',16,2,0],['tavern','🍺 Kocsma',15,2,0],['pool','🏊 Uszoda',25,8,5],['rest','🪑 Pihenő',5,0,0],['barracks','🛡️ Kaszárnya',30,12,10],['temple','🏛️ Görög templom',25,15,10],['pagoda','⛩️ Japán pagoda',26,10,12],['aztec','🗿 Azték piramis',30,18,15],['viking','🛖 Viking ház',18,0,0],['egypt','🔺 Egyiptomi piramis',35,22,20],['road','🛤️ Út',1,0,0],['wall','🧱 Fal',4,0,0],['bridge','🌉 Híd',8,0,0],['fountain','⛲ Szökőkút',10,2,2],['statue','🗽 Szobor',8,4,4],['garden','🌷 Kert',3,0,0],['tree','🌳 Fa',0,0,0],['flowers','🌼 Virág',0,0,0],['orchard','🍎 Gyümölcsfa',0,0,0],['warehouse','📦 Raktár',15,4,0]];const byType=Object.fromEntries(catalog.map(c=>[c[0],c]));let state;try{state=JSON.parse(localStorage.getItem('szigetvilag-v4'))}catch{}if(!state)state={resources:{wood:120,ore:65,food:100},buildings:[],people:[],clock:0};let buildings=[],people=[],animals=[];const message=s=>document.getElementById('msg').textContent=s;function makeBuilding(type,x,z,rot=0,progress=1,record=true){if(!inside(x,z))return null;let p=new T.Group();p.position.set(x,H(x,z),z);p.rotation.y=rot;S.add(p);const b=(w,h,d,m,xx=0,yy=h/2,zz=0)=>box(p,w,h,d,m,xx,yy,zz);if(type==='tree'||type==='orchard'){obj(new T.CylinderGeometry(.18,.25,2,7),mats.wood,0,1,0,p);for(let i=0;i<3;i++)cone(p,1.3-i*.2,1.6,mats.green,0,2+i*.7,0,8)}else if(type==='flowers'){for(let i=0;i<9;i++)obj(new T.SphereGeometry(.16,6,5),i%2?mats.gold:mats.red,(i%3-1)*.5,.15,Math.floor(i/3)*.5-.5,p)}else if(type==='farm'||type==='garden'){b(4,.12,3,type==='farm'?mats.soil:mats.green);for(let i=0;i<10;i++)cone(p,.2,.6,type==='farm'?mats.gold:mats.red,(i%5-2)*.7,.4,(Math.floor(i/5)-.5)*1.4,5)}else if(type==='road'||type==='bridge'){b(4,.12,2,type==='road'?mats.soil:mats.wood)}else if(type==='wall'){b(3,2,.5,mats.stone)}else if(type==='fountain'||type==='pool'){b(type==='pool'?5:2.5,.35,type==='pool'?3:2.5,mats.stone);b(type==='pool'?4.5:2,.08,type==='pool'?2.5:2,mats.water,0,.4,0)}else if(type==='statue'){b(1.4,.4,1.4,mats.stone);obj(new T.CylinderGeometry(.3,.45,2,10),mats.white,0,1.5,0,p)}else if(type==='aztec'||type==='egypt'){for(let i=0;i<5;i++)b(6-i*1,.65,6-i*1,type==='egypt'?mats.sand:mats.stone,0,.35+i*.6,0)}else{let w=['temple','theatre','university','barracks','refinery'].includes(type)?5:3.3,h=['temple','pagoda','university'].includes(type)?2.8:1.8;b(w,h,3,mats.stone);if(type==='viking')b(w,h,3,mats.wood);if(type==='mine')b(w,h,3,mats.ore);if(type==='refinery')b(w,h,3,mats.ore);if(type==='pagoda'){for(let i=0;i<3;i++){b(w-i*.6,.45,3-i*.4,mats.stone,0,1+i*1.15,0);let r=cone(p,2.4-i*.35,.8,mats.red,0,1.6+i*1.15,0,4);r.rotation.y=Math.PI/4}}else{let roof=cone(p,w*.72,1.5,mats.roof,0,h+.65,0,4);roof.rotation.y=Math.PI/4}if(type==='mill'){obj(new T.CylinderGeometry(.12,.12,3,8),mats.wood,0,3.1,1.6,p).rotation.z=Math.PI/2;for(let i=0;i<4;i++){let blade=box(p,.35,2,.12,mats.white,0,3.1,1.8);blade.rotation.z=i*Math.PI/2}}if(type==='temple'||type==='theatre')for(let i=-1;i<=1;i++)obj(new T.CylinderGeometry(.2,.23,2.2,10),mats.white,i*1.4,1.2,1.65,p)}let item={type,x,z,rot,progress,p};p.userData.item=item;p.scale.y=Math.max(.15,progress);buildings.push(item);if(record)saveState();return item}
function addHuman(x,z,sex,age=20,job='szabad',record=true){let p=new T.Group();p.position.set(x,H(x,z),z);S.add(p);let cloth=M(sex==='nő'?0xb35b83:0x426ba3),skin=M(0xd8a47f);obj(new T.CylinderGeometry(.18,.24,.7,8),cloth,0,.52,0,p);obj(new T.SphereGeometry(.21,10,8),skin,0,1.02,0,p);for(let side of [-1,1])obj(new T.CylinderGeometry(.07,.07,.4,7),cloth,side*.12,.17,0,p);p.scale.setScalar(age<16?.7:1);let h={x,z,sex,age,job,p,tx:x,tz:z};people.push(h);if(record)saveState();return h}function animal(x,z,type){let p=new T.Group();p.position.set(x,H(x,z),z);S.add(p);let m=M(type==='szarvas'?0x9c7147:type==='nyúl'?0xd5c6aa:0x454b4a);obj(new T.SphereGeometry(type==='szarvas'?.5:.22,8,6),m,0,.4,0,p);obj(new T.SphereGeometry(.2,8,6),m,.4,.6,0,p);let a={p,x,z,tx:x,tz:z,type};animals.push(a)}function saveState(){state.buildings=buildings.map(o=>({type:o.type,x:o.x,z:o.z,rot:o.rot,progress:o.progress}));state.people=people.map(o=>({x:o.p.position.x,z:o.p.position.z,sex:o.sex,age:o.age,job:o.job}));localStorage.setItem('szigetvilag-v4',JSON.stringify(state))}for(let o of state.buildings)makeBuilding(o.type,o.x,o.z,o.rot,o.progress,false);if(state.people.length)for(let h of state.people)addHuman(h.x,h.z,h.sex,h.age,h.job,false);else for(let i=0;i<14;i++)addHuman((Math.random()-.5)*12,(Math.random()-.5)*12,i%2?'nő':'férfi',i<3?8:20,'szabad',false);if(!buildings.length){for(let i=0;i<100;i++){let x=(Math.random()-.5)*120,z=(Math.random()-.5)*120;if(inside(x,z)&&H(x,z)<6&&Math.hypot(x,z)>14)makeBuilding('tree',x,z,Math.random()*6.28,1,false)}makeBuilding('house',2,2,0,1,false);makeBuilding('house',-3,0,0,1,false)}for(let i=0;i<32;i++){let x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(inside(x,z))animal(x,z,i%3===0?'szarvas':i%3===1?'nyúl':'madár')}saveState();
let mode='build',selectedType='house',selectedHuman=null,rotation=0,theta=.7,phi=.85,dist=115,target=new T.Vector3();function cameraUpdate(){C.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));C.lookAt(target)}cameraUpdate();const ray=new T.Raycaster(),mouse=new T.Vector2();function pick(e){let rect=R.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,C);return ray.intersectObject(ground)[0]?.point}const items=document.getElementById('items');function menu(){items.innerHTML='';if(mode==='build'){for(let c of catalog){let b=document.createElement('button');b.textContent=c[1];b.className=selectedType===c[0]?'on':'';b.onclick=()=>{selectedType=c[0];menu();message(c[1]+' – koppints a kívánt helyre az alap lerakásához')};items.append(b)}let rot=document.createElement('button');rot.textContent='🔄 Forgatás';rot.onclick=()=>{rotation+=Math.PI/4;message('Elforgatva 45°-kal')};items.append(rot)}else{items.textContent=mode==='demolish'?'Érints meg egy épületet a bontáshoz.':mode==='select'?'Érints meg egy lakost.':'Érints meg egy területet faültetéshez.'}}function setMode(m){mode=m;document.querySelectorAll('#top button').forEach(b=>b.classList.toggle('on',b.id===({build:'buildtab',select:'select',demolish:'demolish',plant:'plant'}[m])));menu()}document.getElementById('buildtab').onclick=()=>setMode('build');document.getElementById('select').onclick=()=>setMode('select');document.getElementById('demolish').onclick=()=>setMode('demolish');document.getElementById('plant').onclick=()=>setMode('plant');document.getElementById('newperson').onclick=()=>{addHuman((Math.random()-.5)*8,(Math.random()-.5)*8,Math.random()<.5?'nő':'férfi',20);message('Új lakos érkezett!')};document.getElementById('save').onclick=()=>{saveState();message('Világ elmentve ✓')};document.getElementById('reset').onclick=()=>{if(confirm('Biztosan új szigetet kezdesz?')){localStorage.removeItem('szigetvilag-v4');location.reload()}};document.getElementById('closejobs').onclick=()=>document.getElementById('jobs').style.display='none';const jobs=['szabad','favágó','bányász','farmer','tenyésztő','építő','finomító'];for(let j of jobs){let b=document.createElement('button');b.textContent=j;b.onclick=()=>{selectedHuman.job=j;saveState();document.getElementById('jobs').style.display='none';message('Új foglalkozás: '+j)};document.getElementById('jobbuttons').append(b)}function tap(e){let v=pick(e);if(!v||!inside(v.x,v.z))return;if(mode==='build'||mode==='plant'){let type=mode==='plant'?'tree':selectedType,c=byType[type];if(state.resources.wood<c[2]||state.resources.ore<c[3]||state.resources.food<c[4]){message('Kevés nyersanyag! Fa: '+c[2]+', érc: '+c[3]+', élelem: '+c[4]);return}state.resources.wood-=c[2];state.resources.ore-=c[3];state.resources.food-=c[4];makeBuilding(type,v.x,v.z,rotation,type==='tree'||type==='flowers'?1:.18);message('Építési alap elhelyezve: '+c[1]+' – az építők dolgoznak rajta.')}else if(mode==='demolish'){let o=buildings.map(b=>({...b,d:Math.hypot(b.x-v.x,b.z-v.z)})).sort((a,b)=>a.d-b.d)[0];if(o&&o.d<4){S.remove(o.p);buildings=buildings.filter(b=>b.p!==o.p);saveState();message('Lebontva: '+byType[o.type][1])}}else{let h=people.map(p=>({p,d:Math.hypot(p.p.position.x-v.x,p.p.position.z-v.z)})).sort((a,b)=>a.d-b.d)[0];if(h&&h.d<3){selectedHuman=h.p;document.getElementById('jobs').style.display='block';message(h.p.sex+' • '+h.p.age+' éves • '+h.p.job)}}}let pointers=new Map(),start=null,lastDist=null;const canvas=R.domElement;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});start={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){theta-=(e.clientX-old.x)*.007;phi=Math.max(.22,Math.min(1.45,phi+(e.clientY-old.y)*.007))}else{let ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(lastDist)dist=Math.max(9,Math.min(200,dist*lastDist/d));lastDist=d}cameraUpdate()});canvas.addEventListener('pointerup',e=>{if(start&&pointers.size===1&&Math.hypot(e.clientX-start.x,e.clientY-start.y)<9)tap(e);pointers.delete(e.pointerId);if(pointers.size<2)lastDist=null});canvas.addEventListener('wheel',e=>{dist=Math.max(9,Math.min(200,dist+e.deltaY*.07));cameraUpdate()},{passive:true});setMode('build');let last=performance.now(),tick=0,autosave=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;state.clock+=dt*.012;let phase=state.clock%(Math.PI*2),day=.5+.5*Math.sin(phase);sun.position.set(Math.cos(phase)*50,Math.sin(phase)*65,20);sun.intensity=.35+day*2.1;S.background.setRGB(.08+day*.47,.14+day*.62,.24+day*.66);S.fog.color.copy(S.background);tick+=dt;autosave+=dt;if(tick>2){tick=0;for(let h of people){if(h.age<16)continue;if(h.job==='favágó')state.resources.wood+=2;if(h.job==='bányász')state.resources.ore+=2;if(h.job==='farmer'||h.job==='tenyésztő')state.resources.food+=3;if(h.job==='finomító'&&state.resources.ore>=2){state.resources.ore-=2;state.resources.wood+=1}}let builders=people.filter(h=>h.job==='építő'&&h.age>=16).length;for(let b of buildings)if(b.progress<1){b.progress=Math.min(1,b.progress+.025*(1+builders*2));b.p.scale.y=Math.max(.18,b.progress)}if(Math.random()<.09&&people.length<90&&people.some(h=>h.sex==='férfi'&&h.age>=18)&&people.some(h=>h.sex==='nő'&&h.age>=18))addHuman((Math.random()-.5)*12,(Math.random()-.5)*12,Math.random()<.5?'nő':'férfi',0,'szabad',false);for(let h of people)if(h.age<18){h.age+=.07;h.p.scale.setScalar(h.age<16?.7:1)}}for(let h of [...people,...animals]){if(Math.hypot(h.tx-h.p.position.x,h.tz-h.p.position.z)<1){let x=h.p.position.x+(Math.random()-.5)*14,z=h.p.position.z+(Math.random()-.5)*14;h.tx=inside(x,z)?x:0;h.tz=inside(x,z)?z:0}let dx=h.tx-h.p.position.x,dz=h.tz-h.p.position.z,d=Math.hypot(dx,dz)||1;let speed=h.type==='madár'?1.5:.65;h.p.position.x+=dx/d*dt*speed;h.p.position.z+=dz/d*dt*speed;h.p.position.y=H(h.p.position.x,h.p.position.z)+(h.type==='madár'?3+Math.sin(now*.004):0)}if(autosave>10){autosave=0;saveState()}document.getElementById('info').textContent=`🌲 Fa: ${Math.floor(state.resources.wood)}   ⛏️ Érc: ${Math.floor(state.resources.ore)}   🌾 Élelem: ${Math.floor(state.resources.food)}   👥 ${people.length} lakos   🏠 ${buildings.length} építmény   ${day>.45?'☀️ Nappal':'🌙 Éjszaka'}`;R.render(S,C)}requestAnimationFrame(loop);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
